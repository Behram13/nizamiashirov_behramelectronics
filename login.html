<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daxil Ol | Behram Electronics Inc.</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <span class="brand-badge">Behram Electronics Inc.</span>
            <h1>Sistemə Giriş</h1>
            <p class="subtitle">Avadanlıqlar kataloquna keçmək üçün hesabınıza daxil olun</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">İstifadəçi adı</label>
                    <input type="text" id="username" placeholder="İstifadəçi adınızı yazın" required />
                </div>
                <div class="input-group">
                    <label for="password">Şifrə</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary">Daxil ol</button>
            </form>

            <div id="msg" class="status-msg"></div>

            <div class="switch-link">
                Hesabınız yoxdur? <a href="register.html">Qeydiyyatdan keç</a>
            </div>
        </div>
    </div>

    <script>
        let cooldownTimer = null;

        function startCooldownUI(seconds) {
            const btn = document.getElementById("loginBtn");
            const passInput = document.getElementById("password");
            const msg = document.getElementById("msg");

            btn.disabled = true;
            passInput.disabled = true;
            btn.style.opacity = "0.5";
            btn.style.cursor = "not-allowed";

            let remaining = seconds;
            msg.style.color = "#fbbf24";
            msg.textContent = `⏳ Cooldown aktivdir: ${remaining} saniyə gözləyin...`;
            btn.textContent = `Bloklanıb (${remaining}s)`;

            clearInterval(cooldownTimer);
            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    btn.disabled = false;
                    passInput.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                    btn.textContent = "Daxil ol";
                    msg.style.color = "#38bdf8";
                    msg.textContent = "Blok müddəti bitdi. Yenidən cəhd edə bilərsiniz.";
                } else {
                    msg.textContent = `⏳ Cooldown aktivdir: ${remaining} saniyə gözləyin...`;
                    btn.textContent = `Bloklanıb (${remaining}s)`;
                }
            }, 1000);
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const msg = document.getElementById("msg");

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("behram_user", data.username);
                    msg.style.color = "#4ade80";
                    msg.textContent = "Giriş uğurludur! Kataloq açılır...";
                    setTimeout(() => window.location.href = "behramelectronics.html", 900);
                } else if (res.status === 429 && data.remainingSeconds) {
                    startCooldownUI(data.remainingSeconds);
                } else {
                    msg.style.color = "#f87171";
                    msg.textContent = data.message;
                }
            } catch (err) {
                msg.style.color = "#f87171";
                msg.textContent = "Serverlə əlaqə xətası baş verdi!";
            }
        });
    </script>
</body>
</html>
